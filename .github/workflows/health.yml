name: health
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - id: health
        run: scripts/health.sh health
        continue-on-error: true
      - name: Open or update one issue per broken city
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for file in health/*.txt; do
            slug=$(basename "$file" .txt)
            title="City check failing: $slug"
            body=$(printf '%s\n\n```\n%s\n```\n' "$RUN_URL" "$(head -c 3000 "$file")")
            number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done
      - if: steps.health.outcome == 'failure'
        run: exit 1
