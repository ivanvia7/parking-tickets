name: pypi
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this repo, workflow and environment; no token is stored.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest
      - run: uv build
      - run: uv publish --trusted-publishing always
